# Hexo Configuration
# Docs: https://hexo.io/docs/configuration.html

# Site
title: 芊芊的星际日志
subtitle: '我们曾经仰望星空，思索我们在星辰中的位置'
description: '记录技术探索与星际漫游 —— 爱是唯一可以穿越时间与空间的事物'
keywords: 博客,技术,生活,星际穿越,Hexo
author: Qianqian
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
url: https://qianqian9520.top
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude
include:
exclude:
ignore:

# Extensions
theme: butterfly

# Search
search:
  path: search.xml
  field: post
  content: true
  format: html

# Deployment
deploy:
  type: git
  repo: https://github.com/qianqian9520-pixel/qianqian-blog.git
  branch: gh-pages
